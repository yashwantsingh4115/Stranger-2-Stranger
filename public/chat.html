<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatroom</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <h2>Online (<span id="count">0</span>)</h2>
    <ul id="users"></ul>
    <div class="me-box"><b id="me"></b><button class="link" id="logout">Logout</button></div>
  </aside>
  <section class="main">
    <header class="top">
      <button class="link" id="toggle">👥</button>
      <h1># General</h1>
      <span class="status" id="status">Connecting…</span>
    </header>
    <div id="msgs"></div>
    <div id="typing"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input id="input" maxlength="500" placeholder="Message likho…" disabled>
      <button id="send" disabled>Send</button>
    </form>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
