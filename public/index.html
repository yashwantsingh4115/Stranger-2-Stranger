<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatroom - Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center">
  <form class="card" id="form" autocomplete="off">
    <h1>💬 Chatroom</h1>
    <p class="sub">Username aur DOB daalo aur chat shuru karo.</p>

    <label for="username">Username</label>
    <input id="username" name="username" maxlength="20" required placeholder="e.g. rahul_01" autocapitalize="off" spellcheck="false">

    <label for="dob">Date of Birth</label>
    <input id="dob" name="dob" type="date" required>

    <button class="btn" id="btn" type="submit">Enter Chatroom</button>
    <div class="err" id="err" role="alert"></div>
    <p class="hint">Naya username hai to account apne aap ban jayega. Wapas aane ke liye wahi username + DOB use karna. Dusra koi tumhara username use nahi kar sakta.</p>
  </form>
</div>
<script src="/js/login.js"></script>
</body>
</html>
